<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Heavy shadows — light ones are invisible on near-black" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;display:flex;gap:20px;align-items:center}.c{flex:1;height:110px;border-radius:8px;background:var(--surface-raised);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}.n{font-size:12px;font-weight:700}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}</style></head><body>
<div class="c" style="box-shadow:none"><span class="n">Level 1 — surface</span><span class="h">no shadow, shade step only</span></div>
<div class="c" style="box-shadow:var(--shadow-medium)"><span class="n">Level 2 — elevated</span><span class="h">--shadow-medium 0 8 8 / .3</span></div>
<div class="c" style="box-shadow:var(--shadow-heavy);background:var(--surface-overlay)"><span class="n">Level 3 — dialog</span><span class="h">--shadow-heavy 0 8 24 / .5</span></div>
</body></html>
