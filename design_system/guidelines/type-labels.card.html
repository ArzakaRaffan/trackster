<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.cap{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-muted)}.btn{font-size:14px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;line-height:1;background:var(--surface-interactive);color:#fff;border-radius:9999px;padding:10px 18px}.btn2{font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;line-height:1;background:var(--green);color:#000;border-radius:500px;padding:12px 26px}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-subtle)}</style></head><body>
<div class="row"><span class="cap">Terpakai hari ini</span><span class="cap">Sisa budget</span><span class="h">12px / 700 / 1.4px caps</span></div>
<div class="row"><span class="btn">Minggu ini</span><span class="btn2">Simpan budget</span><span class="h">button caps: 1.4px · 2px</span></div>
</body></html>
