<div class="i"><div class="b" style="border-radius:2px"></div><span class="h">2 tag</span></div>

<div class="i"><div class="b" style="border-radius:6px"></div><span class="h">6 row</span></div>
<div class="i"><div class="b" style="border-radius:8px"></div><span class="h">8 card</span></div>
<div class="i"><div class="b" style="border-radius:10px"></div><span class="h">10 medium</span></div>
