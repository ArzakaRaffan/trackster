<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.t{display:flex;align-items:center;gap:12px}.track{flex:1;height:10px;border-radius:500px;background:var(--surface-track);overflow:hidden}.f{height:100%;border-radius:500px;background:var(--green);width:20%}.a1{animation:g 1.6s cubic-bezier(.3,0,.4,1) infinite alternate}.a2{animation:g 1.6s cubic-bezier(.16,1,.3,1) infinite alternate}@keyframes g{from{width:12%}to{width:88%}}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);width:250px}</style></head><body>
<div class="t"><span class="h">--ease-standard (.3,0,.4,1) · UI state</span><div class="track"><div class="f a1"></div></div></div>
<div class="t"><span class="h">--ease-out (.16,1,.3,1) · bar fill, sheets</span><div class="track"><div class="f a2"></div></div></div>
<div class="h" style="width:auto">durations — fast 120ms (press) · base 200ms (hover, colour) · slow 320ms (progress, enter). No bounce, no spring, no decorative motion.</div>
</body></html>
