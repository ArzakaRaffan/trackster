<!-- @dsCard group="Colors" viewport="700x170" name="Budget Status" subtitle="under / near / over — the only semantic triad" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.c{border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}.t{font-size:14px;font-weight:700}.b{height:10px;border-radius:500px;background:var(--surface-track);overflow:hidden}.f{height:100%;border-radius:500px}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}</style></head><body>
<div class="c" style="background:var(--status-under-bg)"><span class="t" style="color:var(--status-under)">Under budget</span><div class="b"><div class="f" style="width:58%;background:var(--status-under)"></div></div><span class="h">--status-under #1ed760 · &lt;80%</span></div>
<div class="c" style="background:var(--status-near-bg)"><span class="t" style="color:var(--status-near)">Hampir habis</span><div class="b"><div class="f" style="width:88%;background:var(--status-near)"></div></div><span class="h">--status-near #ffa42b · ≥80%</span></div>
<div class="c" style="background:var(--status-over-bg)"><span class="t" style="color:var(--status-over)">Over budget</span><div class="b" style="background:var(--status-over-bg)"><div class="f" style="width:100%;background:var(--status-over)"></div></div><span class="h">--status-over #f3727f · isOverBudget</span></div>
</body></html>
