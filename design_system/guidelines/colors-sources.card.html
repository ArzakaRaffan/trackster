<!-- @dsCard group="Colors" viewport="700x140" name="Bank Sources" subtitle="Provenance hues — reserved, never reused for status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;gap:12px;align-items:stretch}.c{flex:1;background:var(--surface-raised);border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px}.tag{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:3px 8px;border-radius:4px}.m{display:flex;flex-direction:column;gap:3px}.n{font-size:14px;font-weight:700}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}</style></head><body>
<div class="c"><span class="tag" style="color:var(--source-bca);background:var(--source-bca-bg)">BCA</span><span class="m"><span class="n">Announcement blue</span><span class="h">--source-bca #539df5</span></span></div>
<div class="c"><span class="tag" style="color:var(--source-jago);background:var(--source-jago-bg)">Jago</span><span class="m"><span class="n">Warning orange</span><span class="h">--source-jago #ffa42b</span></span></div>
<div class="c"><span class="tag" style="color:var(--text-muted);background:var(--surface-track)">Lain</span><span class="m"><span class="n">Unknown source</span><span class="h">--text-muted #b3b3b3</span></span></div>
</body></html>
