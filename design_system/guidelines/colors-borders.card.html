<!-- @dsCard group="Colors" viewport="700x140" name="Borders & Tracks" subtitle="Hairlines are shadows; tracks are white at 10%" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{border-radius:8px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;height:100px}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.n{font-size:12px;font-weight:700}</style></head><body>
<div class="c" style="box-shadow:inset 0 0 0 1px var(--border-subtle)"><span class="n">Hairline</span><span class="h">--border-subtle #fff 10%</span></div>
<div class="c" style="box-shadow:inset 0 0 0 1px var(--border-default)"><span class="n">Default</span><span class="h">--border-default #4d4d4d</span></div>
<div class="c" style="box-shadow:inset 0 0 0 1px var(--border-strong)"><span class="n">Strong</span><span class="h">--border-strong #7c7c7c</span></div>
<div class="c" style="background:var(--surface-track)"><span class="n">Track</span><span class="h">--surface-track #fff 10%</span></div>
</body></html>
