<!-- @dsCard group="Spacing" viewport="700x160" name="Inset Border (Fields)" subtitle="Recessed ring instead of a raw gray border; focus turns green" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px}.f{display:flex;align-items:center;gap:10px;background:var(--surface-interactive);border-radius:8px;padding:12px 14px;font-size:16px;color:var(--text-base)}.m{color:var(--text-muted)}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-subtle)}</style></head><body>
<div class="f" style="box-shadow:var(--shadow-inset-border)"><span class="m">Rp</span><span>150.000</span></div>
<div class="h">rest — --shadow-inset-border: rgb(18,18,18) 0 1px 0, rgb(124,124,124) 0 0 0 1px inset</div>
<div class="f" style="box-shadow:var(--shadow-inset-accent)"><span class="m">Rp</span><span>150.000</span></div>
<div class="h">focus — --shadow-inset-accent (green 1px inset)</div>
<div class="f" style="box-shadow:rgb(18,18,18) 0 1px 0,var(--text-negative) 0 0 0 1px inset"><span class="m">Rp</span><span>abc</span></div>
<div class="h">invalid — negative red 1px inset</div>
</body></html>
