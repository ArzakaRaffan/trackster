<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;gap:14px;align-items:center}.i{display:flex;flex-direction:column;gap:8px;align-items:center}.h{font-size:10px;font-family:var(--font-mono);color:var(--text-muted);text-align:center}.p{background:var(--green);color:#000;font-size:14px;font-weight:700;letter-spacing:.14px;border-radius:9999px;padding:10px 20px;transition:filter 200ms cubic-bezier(.3,0,.4,1),transform 120ms}.p:hover{filter:brightness(1.08)}.p:active{transform:scale(.97)}.d{background:var(--surface-interactive);color:#fff;font-size:14px;font-weight:700;border-radius:9999px;padding:10px 20px;transition:background 200ms}.d:hover{background:var(--surface-card-alt)}.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:6px;font-size:14px;transition:background 120ms}.row:hover{background:var(--surface-hover)}.cir{width:44px;height:44px;border-radius:50%;background:var(--surface-interactive);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform 120ms}.cir:hover{transform:scale(1.05)}.cir:active{transform:scale(.94)}</style></head><body>
<div class="i"><span class="p">Simpan</span><span class="h">primary<br>brightness 1.08 / scale .97</span></div>
<div class="i"><span class="d">Detail</span><span class="h">dark pill<br>bg → #252525</span></div>
<div class="i"><span class="cir">▶</span><span class="h">circular<br>scale 1.05 / .94</span></div>
<div class="i" style="flex:1"><span class="row" style="width:100%">Indomaret Tebet<span style="margin-left:auto">−Rp87.200</span></span><span class="h">list row — white 7% wash, no border change</span></div>
</body></html>
