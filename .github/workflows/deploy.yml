name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/arzakaraffan

# Default token minimal; job build menaikkan sendiri ke packages:write. Deploy berurutan (dua push cepat tak saling tabrak di VPS).
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Build di runner GitHub (7GB RAM) — VPS 2GB cuma pull image, tidak build.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (pin SHA: tag bisa dipindah pemilik repo)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/backend
          push: true
          build-args: NODE_HEAP_MB=4096
          tags: |
            ${{ env.REGISTRY }}/trackster-backend:latest
            ${{ env.REGISTRY }}/trackster-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./apps/frontend
          push: true
          build-args: |
            NODE_HEAP_MB=4096
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackster.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://trackster.dev' }}
          tags: |
            ${{ env.REGISTRY }}/trackster-frontend:latest
            ${{ env.REGISTRY }}/trackster-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.0.3 (menerima kunci SSH VPS)
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/trackster
            # checkout di VPS cuma buat docker-compose.prod.yml + nginx/, bukan build
            git fetch origin
            PREV=$(git rev-parse HEAD)
            git reset --hard origin/main
            # Uji config nginx baru di kontainer sekali-pakai SEBELUM apa pun di-restart. Gagal → folder nginx/ dikembalikan
            # ke versi sebelumnya & deploy berhenti (nginx yang jalan tak tersentuh, restart berikutnya tetap pakai config lama yang sah).
            if ! docker compose -f docker-compose.prod.yml run --rm --no-deps -T --entrypoint nginx nginx -t; then
              git checkout "$PREV" -- nginx
              echo "nginx -t gagal: config baru tidak dipasang" >&2
              exit 1
            fi
            docker compose -f docker-compose.prod.yml pull backend frontend
            docker compose -f docker-compose.prod.yml up -d
            # `up -d` tak membaca ulang bind mount nginx bila kontainernya tidak dibuat ulang → reload eksplisit.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
            docker image prune -f
