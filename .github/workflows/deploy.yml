name: Deploy to VPS

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io/arzakaraffan

# Default token minimal; job build menaikkan sendiri ke packages:write. Deploy berurutan (dua push cepat tak saling tabrak di VPS).
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Build di runner GitHub (7GB RAM) — VPS 2GB cuma pull image, tidak build.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pin SHA: tag bisa dipindah pemilik repo)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/backend
          push: true
          build-args: NODE_HEAP_MB=4096
          tags: |
            ${{ env.REGISTRY }}/trackster-backend:latest
            ${{ env.REGISTRY }}/trackster-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build & push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./apps/frontend
          push: true
          build-args: |
            NODE_HEAP_MB=4096
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.trackster.dev' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://trackster.dev' }}
          tags: |
            ${{ env.REGISTRY }}/trackster-frontend:latest
            ${{ env.REGISTRY }}/trackster-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3 (menerima kunci SSH VPS)
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/trackster
            # checkout di VPS cuma buat docker-compose.prod.yml + nginx/, bukan build
            git fetch origin
            PREV=$(git rev-parse HEAD)
            git reset --hard origin/main
            # Uji config nginx baru di kontainer sekali-pakai SEBELUM apa pun di-restart. Gagal → folder nginx/ dikembalikan
            # ke versi sebelumnya & deploy berhenti (nginx yang jalan tak tersentuh, restart berikutnya tetap pakai config lama yang sah).
            if ! docker compose -f docker-compose.prod.yml run --rm --no-deps -T --entrypoint nginx nginx -t; then
              git checkout "$PREV" -- nginx
              echo "nginx -t gagal: config baru tidak dipasang" >&2
              exit 1
            fi
            docker compose -f docker-compose.prod.yml pull backend frontend
            # Backup SEBELUM backend baru menjalankan `prisma migrate deploy`. Gagal → deploy berhenti, versi lama tetap jalan.
            docker compose -f docker-compose.prod.yml run --rm --no-deps -T db-backup once predeploy
            docker compose -f docker-compose.prod.yml up -d
            # `up -d` tak membaca ulang bind mount nginx bila kontainernya tidak dibuat ulang → reload eksplisit.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
            docker image prune -f
