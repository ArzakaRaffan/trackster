# --- DLMM Dashboard: dlmm.trackster.my.id ---
server {
    listen 80;
    server_name dlmm.trackster.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dlmm.trackster.my.id;

    ssl_certificate /etc/letsencrypt/live/dlmm.trackster.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dlmm.trackster.my.id/privkey.pem;

    location / {
        proxy_pass http://host.docker.internal:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
