# --- Catatan Kita: arzaz.trackster.cloud ---
server {
    listen 80;
    server_name arzaz.trackster.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name arzaz.trackster.cloud;

    ssl_certificate /etc/letsencrypt/live/arzaz.trackster.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arzaz.trackster.cloud/privkey.pem;

    auth_basic "Catatan Kita";
    auth_basic_user_file /etc/nginx/conf.d/arzaz.htpasswd;

    root /etc/nginx/conf.d/arzaz-site;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
