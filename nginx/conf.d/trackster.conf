# --- Frontend: track.trackster.my.id ---
server {
    listen 80;
    server_name track.trackster.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name track.trackster.my.id;

    ssl_certificate /etc/letsencrypt/live/track.trackster.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.trackster.my.id/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Backend API: api.track.trackster.my.id ---
server {
    listen 80;
    server_name api.track.trackster.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.track.trackster.my.id;

    ssl_certificate /etc/letsencrypt/live/api.track.trackster.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.track.trackster.my.id/privkey.pem;

    location / {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
