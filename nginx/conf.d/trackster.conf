# --- Frontend: trackster.dev ---
server {
    listen 80;
    server_name trackster.dev track.trackster.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trackster.dev$request_uri;
    }
}

# Redirect old domain HTTPS to new domain HTTPS
server {
    listen 443 ssl;
    server_name track.trackster.my.id;

    ssl_certificate /etc/letsencrypt/live/track.trackster.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.trackster.my.id/privkey.pem;

    return 301 https://trackster.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name trackster.dev;

    ssl_certificate /etc/letsencrypt/live/trackster.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackster.dev/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    location / {
        set $frontend_upstream http://trackster-frontend-1:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Backend API: api.trackster.dev ---
server {
    listen 80;
    server_name api.trackster.dev api.track.trackster.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.trackster.dev$request_uri;
    }
}

# Redirect old API domain HTTPS to new API domain HTTPS
server {
    listen 443 ssl;
    server_name api.track.trackster.my.id;

    ssl_certificate /etc/letsencrypt/live/api.track.trackster.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.track.trackster.my.id/privkey.pem;

    return 301 https://api.trackster.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name api.trackster.dev;

    ssl_certificate /etc/letsencrypt/live/api.trackster.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.trackster.dev/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    client_max_body_size 20M;

    location / {
        set $backend_upstream http://trackster-backend-1:4000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
