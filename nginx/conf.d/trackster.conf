# --- Global (konteks http; file conf.d di-include di dalam http {}) ---
# Perubahan file ini TIDAK aktif otomatis saat deploy (kontainer nginx tidak dibuat ulang) — CD menjalankan
# `nginx -t && nginx -s reload` (lihat .github/workflows/deploy.yml); config rusak = reload dibatalkan, config lama tetap jalan.
server_tokens off;

# TLS: hanya 1.2/1.3 (cipher bawaan OpenSSL modern), sesi di-cache supaya kunjungan ulang tanpa handshake penuh.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TRK_SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Kompresi respons teks (JSON API, ICS, CSV, SVG). text/event-stream sengaja TIDAK (SSE chat harus mengalir per token).
# Frontend Next sudah mengompres sendiri; gzip_proxied any + Vary aman untuk keduanya.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/calendar text/csv image/svg+xml application/manifest+json;

# Rate limit per IP (DNS-only, bukan proxy Cloudflare → $binary_remote_addr = IP klien asli). Lapisan sebelum Node,
# murah di RAM (10MB ≈ 160rb IP). Login/daftar/reset juga dibatasi di backend (per IP & per username).
limit_req_zone $binary_remote_addr zone=trk_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=trk_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=trk_web:10m rate=50r/s;
limit_req_status 429;

# Access log tanpa rahasia: segmen URL yang berfungsi sebagai kunci (secret webhook Telegram, ownerToken split bill/trip,
# tanda tangan feed .ics, kode undangan/reset) disensor. Referer tidak dicatat (bisa memuat URL yang sama).
map $request_uri $trk_safe_uri {
    "~^(?<trk_p>/telegram/webhook/)"                        "${trk_p}[redacted]";
    "~^(?<trk_p>/(?:split-bills|trips|trip)/manage/)"       "${trk_p}[redacted]";
    "~^(?<trk_p>/(?:calendar|invite|reset)/)"               "${trk_p}[redacted]";
    default                                                 $request_uri;
}
log_format trk_redacted '$remote_addr [$time_local] "$request_method $trk_safe_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

# SNI tak dikenal (scanner yang menembak IP langsung) → handshake ditolak, tak membocorkan sertifikat/host.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

# --- Frontend: trackster.dev ---
server {
    listen 80;
    server_name trackster.dev track.trackster.my.id;
    access_log /var/log/nginx/access.log trk_redacted;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trackster.dev$request_uri;
    }
}

# Redirect old domain HTTPS to new domain HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name track.trackster.my.id;
    access_log /var/log/nginx/access.log trk_redacted;

    ssl_certificate /etc/letsencrypt/live/track.trackster.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.trackster.my.id/privkey.pem;

    return 301 https://trackster.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name trackster.dev;
    access_log /var/log/nginx/access.log trk_redacted;

    ssl_certificate /etc/letsencrypt/live/trackster.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trackster.dev/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1m; # frontend tidak menerima upload (foto struk langsung ke API)

    limit_req zone=trk_web burst=200 nodelay;

    location / {
        set $frontend_upstream http://trackster-frontend-1:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Backend API: api.trackster.dev ---
server {
    listen 80;
    server_name api.trackster.dev api.track.trackster.my.id;
    access_log /var/log/nginx/access.log trk_redacted;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.trackster.dev$request_uri;
    }
}

# Redirect old API domain HTTPS to new API domain HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name api.track.trackster.my.id;
    access_log /var/log/nginx/access.log trk_redacted;

    ssl_certificate /etc/letsencrypt/live/api.track.trackster.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.track.trackster.my.id/privkey.pem;

    return 301 https://api.trackster.dev$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.trackster.dev;
    access_log /var/log/nginx/access.log trk_redacted;

    ssl_certificate /etc/letsencrypt/live/api.trackster.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.trackster.dev/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    # Batas terbesar = foto struk (sudah dikecilkan browser; backend membatasi 6MB) / email MIME 3MB.
    client_max_body_size 8m;

    # Header proxy diwariskan ke semua location di bawah (tak ada location yang mendefinisikan proxy_set_header sendiri).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr; # timpa (bukan tambah): backend trust proxy 1 → req.ip = IP asli, tak bisa dipalsukan
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # chat AI (SSE + tool call) bisa diam >60 dtk sebelum token pertama

    location ~ ^/auth/(login|register|reset-password|change-password)$ {
        limit_req zone=trk_auth burst=10 nodelay;
        set $backend_upstream http://trackster-backend-1:4000;
        proxy_pass $backend_upstream;
    }

    location / {
        limit_req zone=trk_api burst=150 nodelay;
        set $backend_upstream http://trackster-backend-1:4000;
        proxy_pass $backend_upstream;
    }
}
