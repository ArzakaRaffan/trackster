<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14140f" media="(prefers-color-scheme: dark)">
<title>Catatan Kita</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // apply saved theme before first paint
  try{
    var t = localStorage.getItem('ck-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
</script>
</head>
<body>
  <div id="loading">memuat catatan…</div>

  <div id="app">
    <header id="topbar">
      <button class="icon-btn" id="back-btn" aria-label="Kembali">‹</button>
      <h1 id="topbar-title"></h1>
      <button class="icon-btn" id="theme-btn" aria-label="Ganti tema">◐</button>
    </header>
    <main id="screen"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
