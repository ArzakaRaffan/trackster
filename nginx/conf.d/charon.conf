# --- Charon Dashboard: charon.trackster.cloud ---
server {
    listen 80;
    server_name charon.trackster.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name charon.trackster.cloud;

    ssl_certificate /etc/letsencrypt/live/charon.trackster.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/charon.trackster.cloud/privkey.pem;

    auth_basic "Charon";
    auth_basic_user_file /etc/nginx/conf.d/charon.htpasswd;

    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
